[workspace]
resolver = "3"
members = ["prototypes/slint-scroll"]

[workspace.package]
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Profil de mesure : comme release, mais avec symboles pour profiler (WPA, superluminal).
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
